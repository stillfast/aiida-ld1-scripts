[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'aiida-ld1-scripts'
dynamic = ['version']
description = 'Scripts that generate and verify a pseudopotential with aiida-ld1'
readme = 'README.md'
license = {file = 'LICENSE'}
authors = [{name = 'Li Guozhou'}]
classifiers = [
    'Framework :: AiiDA',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Physics',
]
requires-python = '>=3.10'
dependencies = ['aiida-core>=2.5,<3', 'aiida-ld1>=0.2', 'numpy', 'matplotlib', 'pyyaml']

[project.urls]
Home = 'https://github.com/stillfast/aiida-ld1-scripts'
Source = 'https://github.com/stillfast/aiida-ld1-scripts'

[project.optional-dependencies]
tests = ['pytest>=7']

[tool.hatch.build.targets.wheel]
packages = ['src/aiida_ld1_scripts']

[tool.hatch.version]
path = 'src/aiida_ld1_scripts/__init__.py'

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
